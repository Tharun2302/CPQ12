name: Debug Server Logs

on:
  push:
    branches: [feature/gstack-implementation]
    paths: ['.github/workflows/debug-logs.yml']

jobs:
  dump-logs:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Dump container state and logs
        env:
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          sshpass -p "$DEPLOY_PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" << 'REMOTESCRIPT'

          echo "===== CONTAINERS (all) ====="
          docker ps -a --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"

          echo ""
          echo "===== RESTART COUNT / STARTED AT ====="
          docker inspect -f '{{.Name}} restarts={{.RestartCount}} started={{.State.StartedAt}} status={{.State.Status}}' cpq-application 2>/dev/null || echo "cpq-application not found"

          echo ""
          echo "===== LISTENING SOCKETS ON 3001/5173/3000 ====="
          ss -tlnp | grep -E ':(3001|5173|3000)' || echo "none"

          echo ""
          echo "===== DIST CONTENTS INSIDE CONTAINER ====="
          docker exec cpq-application ls -la /app/dist/assets 2>/dev/null | head -15 || echo "cannot list dist"

          echo ""
          echo "===== MEMORY / DISK ====="
          free -m | head -3
          df -h / | tail -1

          echo ""
          echo "===== LAST 120 LOG LINES: cpq-application ====="
          docker logs --tail 120 cpq-application 2>&1 | tail -120

          REMOTESCRIPT

version: '3.8'

networks:
  cpq-network:
    driver: bridge

services:
  # PDF conversion microservice - keeps LibreOffice warm for fast conversions (1-2s vs 8-10s)
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: cpq-gotenberg
    networks:
      - cpq-network
    restart: unless-stopped
    # Internal network access at http://gotenberg:3000
    # No port mapping - accessed internally

  # Main CPQ12 application (React frontend + Express backend)
  app:
    build:
      context: ../
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:3000}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
        VITE_MSAL_CLIENT_ID: ${VITE_MSAL_CLIENT_ID}
        VITE_MSAL_REDIRECT_URI: ${VITE_MSAL_REDIRECT_URI}
        VITE_CLARITY_ID: ${VITE_CLARITY_ID}
    container_name: cpq-application
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      GOTENBERG_URL: http://gotenberg:3000
      MONGODB_URI: ${MONGODB_URI}
      DB_NAME: ${DB_NAME}
      HUBSPOT_API_KEY: ${HUBSPOT_API_KEY}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      JWT_SECRET: ${JWT_SECRET}
      BOLDSIGN_API_KEY: ${BOLDSIGN_API_KEY}
      BOLDSIGN_BASE_URL: ${BOLDSIGN_BASE_URL}
      BOLDSIGN_APP_URL: ${BOLDSIGN_APP_URL}
      APP_BASE_URL: ${APP_BASE_URL}
      BASE_URL: ${BASE_URL}
      SOFFICE_PATH: /usr/bin/libreoffice
    env_file:
      - .env
    volumes:
      - ./temp-files:/app/temp
    restart: unless-stopped
    networks:
      - cpq-network
    depends_on:
      - gotenberg
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: cpq-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - cpq-network

  # Optional: OnlyOffice Document Server (activate with: docker-compose --profile onlyoffice up)
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: cpq-onlyoffice
    networks:
      - cpq-network
    environment:
      - JWT_ENABLED=false
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=onlyoffice
      - DB_USER=onlyoffice
      - DB_PWD=onlyoffice
    ports:
      - "3003:80"
    volumes:
      - ./onlyoffice-data:/var/www/onlyoffice/Data
      - ./onlyoffice-local-override.json:/etc/onlyoffice/documentserver/local-production-linux.json:ro
    depends_on:
      - postgres
    restart: unless-stopped
    profiles:
      - onlyoffice

  # Optional: PostgreSQL database (only for OnlyOffice, activate with: docker-compose --profile onlyoffice up)
  postgres:
    image: postgres:13
    container_name: cpq-postgres
    networks:
      - cpq-network
    environment:
      - POSTGRES_DB=onlyoffice
      - POSTGRES_USER=onlyoffice
      - POSTGRES_PASSWORD=onlyoffice
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    profiles:
      - onlyoffice


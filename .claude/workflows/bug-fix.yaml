# Bug Fix Workflow

## Description
Streamlined pipeline for fixing bugs, skipping design phase.

## Phases

### Phase 1: Bug Analysis
- Understand the bug
- Identify root cause
- Identify affected areas
- List required fixes

### Phase 1.5: Rollback Decision (alternative to fix-forward)

Before starting implementation, decide whether to **fix forward** (Phase 2 onward) or **roll back** to a known-good commit instead. Rollback is not a substitute for fixing the bug — it's a way to stop user impact immediately while the real fix is developed separately.

**Consider rollback when:**
- [ ] The bug was introduced by a recent deploy and a known-good prior commit exists
- [ ] Severity is Critical or High and a proper fix will take longer than acceptable downtime
- [ ] Matches the "Rollback if" criteria in `deployment.yaml` (broken critical feature, DB corruption, severe perf hit, security issue, high error volume)

**Do NOT roll back when:**
- [ ] The bug has always existed (no good prior commit to return to)
- [ ] It matches "Do NOT rollback for" in `deployment.yaml` (minor UI issue, non-critical bug, single log entry) — fix forward instead

**If rollback is chosen:**
1. Gate — ask user: confirm rollback, and to which commit/environment (same Gate 1/2/3 pattern as Phase 7)
2. DevOps Engineer executes: backup (Mongo/Postgres) → stop containers → `git reset --hard <target-commit>` → rebuild → start → health check
3. Verify: health check passes, feature/data confirmed restored, no data loss (rollback never touches DB volumes; only a backup-restore does)
4. Report the deployed commit and health status
5. **Follow-up required:** the branch tip still points at the buggy commit — the next unrelated push will redeploy it and silently undo the rollback. Either revert the buggy commit on the branch (Gate 1/2/3 applies) or track this as an open risk until Phase 2 fix-forward lands
6. Proceed to Phase 2 anyway if a permanent fix is still needed — rollback buys time, it doesn't close the bug

### Phase 2: Fix Implementation
- Backend Engineer OR Frontend Engineer fixes code
  - If backend bug: Backend Engineer codes fix
  - If frontend bug: Frontend Engineer codes fix
  - If both: Both work in parallel
- Write/update tests
- Verify fix works

### Phase 3: Testing
- QA Engineer tests the fix
- Verify bug is resolved
- Verify no new bugs introduced
- Test edge cases

### Phase 4: Security Check (if applicable)
- Security Reviewer checks fix
- Especially if security-related bug
- Ensure fix doesn't introduce vulnerabilities

### Phase 5: Code Review
- Code Reviewer reviews fix code
- Check code quality
- Check test coverage

### Phase 6: Documentation Update
- Documentation Engineer updates docs
- Update CHANGELOG with bug fix
- Update relevant docs if behavior changed

### Phase 7: Commit & Release Decision (requires user confirmation)
- Gate 1 — Ask user: commit and push to the working branch? (never auto-commit)
  - If no: stop, nothing is saved
  - If yes: stage only the files relevant to this fix, commit with conventional commit message (fix: ...), push to the working branch
- Gate 2 — Ask user: deploy this fix now, or stop here (commit only)?
  - If no deploy: workflow ends after commit — do not ask about environments
- Gate 3 (only if Gate 2 = yes) — Ask user: target environment?
  - **dev** = MERGE the working branch into `main` and push → `deploy-dev.yml` auto-deploys `main` to the DEV server (159.89.175.168:3001)
  - **production** = a deliberate MANUAL SSH deploy to `zenop.ai`. No branch operation triggers it
- IMPORTANT: in this repo, merging to `main` and deploying to **dev** are the SAME action — any push to `main` triggers `deploy-dev.yml`. There is no merge-without-deploy path. Never merge to `main` unless the user approved a dev deploy at Gate 3
- Pushing the working branch alone deploys NOTHING. `deploy-dev.yml` only fires on `main` (or manual `workflow_dispatch`)
- Production has NO pipeline and is never a side effect of a merge. It requires its own explicit approval and the manual procedure in `devops-engineer.md`
- Only proceed to Deployment phase after explicit approval

### Phase 8: Deployment
- DevOps Engineer deploys hotfix
- Deploy to approved target environment
- Monitor for issues

## Success Criteria

- [ ] Bug reproduced and understood
- [ ] Fix implemented
- [ ] Tests passing
- [ ] QA verified bug is fixed
- [ ] No new bugs introduced
- [ ] Code review approved
- [ ] User approved commit, merge decision, and deploy target
- [ ] Deployed to approved environment

## Timeline

Estimated time: 2-8 hours depending on complexity

- Analysis: 15-30 minutes
- Implementation: 1-4 hours
- Testing: 30 minutes - 2 hours
- Code Review: 15-30 minutes
- Deployment: 15-30 minutes

## Critical Bug Hotfix

If critical bug in production:
1. Fix immediately (skip some reviews if necessary)
2. Deploy to production
3. Complete reviews post-deployment
4. Monitor closely

## Bug Severity

| Severity | Timeline | Process |
|---|---|---|
| **Critical** | Immediate | Fix → Deploy → Review |
| **High** | Same day | Standard process |
| **Medium** | Within 2 days | Standard process |
| **Low** | Next sprint | Batch with other fixes |

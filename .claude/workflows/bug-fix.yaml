# Bug Fix Workflow — RETIRED

This workflow has been replaced by the AI SDLC modes. See the **AI SDLC Router** section
in `CLAUDE.md` for mode selection.

## A bug fix now routes as

| Situation | Mode | File |
|---|---|---|
| Cause **not** known | Investigation → then re-route | `investigation.yaml` |
| Cause known, fix is local | Direct | `direct.yaml` |
| Cause known, fix needs design | Feature | `new-feature.yaml` |

Investigation ends in a proposal. Once the user approves it, the Router selects the mode
again — Direct or Feature.

## Where the content went

| Was here | Now in |
|---|---|
| Phase 1 — Bug Analysis | `investigation.yaml` (Reproduce → Isolate → Root cause) |
| Phase 1.5 — Rollback Decision, incl. the branch-tip warning | `deployment.yaml` → **Rollback Play** |
| Phase 2 — Fix Implementation | `direct.yaml` |
| Phases 3–6 — testing, security, review, docs | Mode verification phases |
| Phase 7 — Commit & Release gates | Unchanged, in `CLAUDE.md` |
| Bug Severity table | `investigation.yaml` |
| Critical Bug Hotfix note | `deployment.yaml` |

**This file is a pointer only. Do not add logic here.**

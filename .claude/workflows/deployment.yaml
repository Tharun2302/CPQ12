# Deployment Workflow

## Description
Runbook for deploying to the dev and production environments. This is **not** a mode —
it is the procedure invoked by the deploy gate after a mode's work is complete.

## Pre-Deployment Checklist

- [ ] All tests passing
- [ ] Code review approved
- [ ] Security review passed
- [ ] Database migrations tested
- [ ] No breaking changes documented
- [ ] Backups created
- [ ] Team notified
- [ ] User explicitly confirmed commit (and WHICH BRANCH to commit to — never assume the current one), THEN push, THEN whether to deploy at all, THEN (only if deploying) WHICH BRANCH to deploy from, THEN target environment: dev vs production — never assume any of these
- [ ] Understand the merge rule: choosing **dev** means merging the working branch into `main` — and any push to `main` auto-triggers `deploy-dev.yml`, which deploys to the DEV server. Merge-to-main and dev-deploy are one and the same action; never merge to `main` without explicit dev-deploy approval. **production** (`zenop.ai`) has NO pipeline — it is a separate manual SSH procedure that no branch operation triggers

## Phases

> There is **no staging environment**. The two real targets are DEV
> (`159.89.175.168:3001`, automated) and PRODUCTION (`zenop.ai`, manual). See CLAUDE.md
> → Deployment Process for the authoritative behaviour.

### Phase 1: Pre-flight

- `npm test` passes
- `npm run build` succeeds
- Confirm which target was approved at the deploy gate (dev or production)
- Confirm the branch to deploy from

### Phase 2: DEV deployment (automated)

- Merging/pushing the working branch to `main` triggers `.github/workflows/deploy-dev.yml`
- CI SSHes to the dev server, pulls `main`, runs `docker compose up -d --build` in
  `deploymentgigitaldocker/`, prunes old images, then polls
  `http://159.89.175.168:3001/api/health`
- If the health check fails after 5 attempts, the job fails — investigate before retrying

### Phase 3: PRODUCTION deployment (manual)

- Back up MongoDB first
- Manual SSH procedure on the production host — see `.claude/agents/devops-engineer.md`
  for the authoritative steps
- Run health checks; verify services started
- Monitor for errors

### Phase 4: Post-Deployment Verification

- Smoke test the deployed environment: `node scripts/qa-smoke.cjs --base-url=<target>`
- Check `GET /api/health`
- Verify the specific feature or fix that was deployed
- Monitor error logs

## Rollback Play

*(Moved here from the retired `bug-fix.yaml`. Applies both as an alternative to fixing
forward, and as the response to a bad deploy.)*

Rollback is not a substitute for fixing the bug — it stops user impact immediately while
the real fix is developed separately.

**Consider rollback when:**
- [ ] The bug was introduced by a recent deploy and a known-good prior commit exists
- [ ] Severity is Critical or High and a proper fix will take longer than acceptable downtime
- [ ] It matches the "Rollback if" criteria below (broken critical feature, DB corruption,
      severe perf hit, security issue, high error volume)

**Do NOT roll back when:**
- [ ] The bug has always existed — there is no good prior commit to return to
- [ ] It matches "Do NOT rollback for" below (minor UI issue, non-critical bug, single log
      entry) — fix forward instead

**If rollback is chosen:**

1. **Gate** — ask the user to confirm the rollback, and to which commit and environment
   (same gate pattern as any other deploy: whether → which branch → which target)
2. DevOps Engineer executes: back up MongoDB → stop containers →
   `git reset --hard <target-commit>` → rebuild → start → health check
3. Verify: health check passes, feature/data confirmed restored, no data loss (rollback
   never touches DB volumes; only a backup-restore does)
4. Report the deployed commit and health status
5. **Follow-up required:** the branch tip still points at the buggy commit — the next
   unrelated push will redeploy it and silently undo the rollback. Either revert the buggy
   commit on the branch (gates apply) or track it as an open risk until the fix lands
6. Return to `investigation.yaml` if the permanent fix is still outstanding — rollback buys
   time, it does not close the bug

## Critical Bug Hotfix

If a critical bug is live in production:

1. Fix immediately — some reviews may be deferred
2. Deploy to the affected environment
3. Complete the deferred reviews **post-deployment**, not never
4. Monitor closely

## Deployment Environments

### Development — `159.89.175.168:3001`
- DigitalOcean droplet, `~/CPQ12` clone with `deploymentgigitaldocker/` inside
- Single `app` service → container `cpq-application` on port 3001, exposed directly
  (no nginx, no TLS)
- Mongo runs as a separate container (`cpq12-mongo-1`, different compose project)
- Deployed automatically on every push to `main`
- Health: `http://159.89.175.168:3001/api/health`

### Production — `zenop.ai` / `167.71.227.231`
- Live environment, real user data
- Same folder layout as dev, plus an nginx container for TLS termination
- **No pipeline.** Deployed by manual SSH only
- Back up MongoDB before deploying
- CSP headers are set in `server.cjs`, **not** in the nginx config

## Deployment Commands

There is no root `Dockerfile`, no image registry, and none of the `deploy-*.sh` /
`rollback-*.sh` scripts that earlier versions of this file referenced. The real commands are:

```bash
# Pre-flight (local)
npm test
npm run build

# DEV deploy — merging to main is the deploy. CI does the rest.
git checkout main && git merge <working-branch> && git push origin main
curl -s http://159.89.175.168:3001/api/health

# DEV deploy, manual re-run without a new commit
gh workflow run deploy-dev.yml

# PRODUCTION deploy — manual, on the production host
# (see .claude/agents/devops-engineer.md for the authoritative procedure)
cd ~/CPQ12 && git fetch && git checkout main && git pull
cd deploymentgigitaldocker && docker compose up -d --build
docker image prune -f

# Rollback — on the target host, after backing up MongoDB
git reset --hard <known-good-commit>
cd deploymentgigitaldocker && docker compose up -d --build
```

## Timeline

- Dev deploy (automated, incl. health check): ~2-5 minutes
- Production deploy (manual): 15-30 minutes
- Post-deployment verification: 30 minutes+

## Monitoring After Deployment

### First 30 minutes
- Monitor error logs continuously
- Check CPU/Memory usage
- Verify API endpoints responding
- Check database connections

### First hour
- Monitor customer reports
- Check performance metrics
- Verify all features working
- Review application logs

### First 24 hours
- Continue monitoring
- Watch for trends
- Monitor database backups
- Verify data integrity

## Communication

### Before Deployment
- Notify team of deployment time
- Estimated downtime (if any)
- Features being deployed

### During Deployment
- Update progress channel
- Alert team to any issues
- Rollback decision if needed

### After Deployment
- Confirm successful deployment
- List deployed features
- Known issues (if any)
- Next steps

## Rollback Decision

Rollback if:
- [ ] Critical feature not working
- [ ] Database corruption detected
- [ ] Performance significantly degraded
- [ ] Security issue detected
- [ ] Large number of errors in logs

Do NOT rollback for:
- [ ] Minor UI issues
- [ ] Non-critical feature bugs
- [ ] Single error log entry


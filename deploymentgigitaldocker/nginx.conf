user nginx;

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Logging
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log warn;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript
             application/json application/javascript application/xml+rss
             application/rss+xml font/truetype font/opentype
             application/vnd.ms-fontobject image/svg+xml;
  gzip_disable "msie6";

  # Client settings
  client_max_body_size 50m;
  client_body_buffer_size 128k;

  # Upstream to the Docker service 'app'
  upstream cpq_app {
    server app:3001;
    keepalive 32;
  }

  # Upstream to the OnlyOffice Document Server
  upstream onlyoffice_ds {
    server onlyoffice:80;
  }

  # WebSocket connection-upgrade map (required by OnlyOffice)
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  # HTTP -> HTTPS redirect (main app)
  server {
    listen 80;
    listen [::]:80;
    server_name zenop.ai www.zenop.ai;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS reverse proxy (main app)
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zenop.ai www.zenop.ai;

    # TLS Configuration
    ssl_certificate     /etc/letsencrypt/live/zenop.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zenop.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Health endpoint
    location = /nginx-health {
      access_log off;
      return 200 "ok";
      add_header Content-Type text/plain;
    }

    # API routes - no caching, direct proxy
    location /api/ {
      proxy_pass http://cpq_app;
      proxy_http_version 1.1;

      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port $server_port;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
      add_header Pragma "no-cache";
      add_header Expires "0";
    }

    # Static assets with caching (JS, CSS, images, fonts)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|otf|webp|avif)$ {
      proxy_pass http://cpq_app;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      access_log off;
    }

    # Vite manifest and other build files - short cache
    location ~* \.(map|json)$ {
      proxy_pass http://cpq_app;
      proxy_set_header Host $http_host;
      expires 1h;
      add_header Cache-Control "public, max-age=3600";
    }

    # Main SPA route - serve index.html for all non-API routes
    location / {
      proxy_pass http://cpq_app;
      proxy_http_version 1.1;

      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port $server_port;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
      add_header Pragma "no-cache";
      add_header Expires "0";
    }
  }

  # =====================================================================
  # OnlyOffice Document Server  -  https://zenop.ai:8443
  # (same hostname, reuses the zenop.ai certificate)
  # =====================================================================
  server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name zenop.ai;

    ssl_certificate     /etc/letsencrypt/live/zenop.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zenop.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OnlyOffice uploads/downloads can be large
    client_max_body_size 100m;

    location / {
      proxy_pass http://onlyoffice_ds;
      proxy_http_version 1.1;

      # WebSocket support (live editing)
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # Tell OnlyOffice it is behind HTTPS
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 60s;
      proxy_send_timeout 3600s;
      proxy_read_timeout 3600s;
    }
  }
}

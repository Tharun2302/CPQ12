<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <!-- Reload every minute so visitors land back on their page once the site is up -->
  <meta http-equiv="refresh" content="60">
  <title>Zenop.ai is temporarily down</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #4b5563;
      --border: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1120;
        --card: #111827;
        --text: #f9fafb;
        --muted: #9ca3af;
        --border: #1f2937;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
    }
    .card {
      width: 100%;
      max-width: 480px;
      padding: 40px 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
      text-align: center;
    }
    .badge {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
    }
    h1 { margin: 0 0 12px; font-size: 24px; font-weight: 700; }
    p { margin: 0 0 12px; color: var(--muted); font-size: 16px; }
    .brand { margin-top: 28px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>
      </svg>
    </div>
    <h1>Zenop.ai is temporarily down</h1>
    <p>We're doing some maintenance right now.</p>
    <p>Please try again in a few minutes. This page will refresh on its own.</p>
    <div class="brand">CloudFuze Zenop.ai</div>
  </main>
</body>
</html>
